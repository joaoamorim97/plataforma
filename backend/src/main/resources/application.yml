spring:
  application:
    name: plataforma-backend
  profiles:
    # Default profile. Set SPRING_PROFILES_ACTIVE=supabase to use the Supabase Postgres database.
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  # Render (e a maioria dos PaaS) injeta a porta via variável PORT.
  # Usa PORT se existir; senão SERVER_PORT; senão 8080 (local).
  port: ${PORT:${SERVER_PORT:8080}}

app:
  supabase:
    # Supabase JWT secret (HS256 legado) usado para validar access tokens.
    # Project Settings -> API -> JWT Secret. Em branco = não valida HS256.
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    # JWKS do Supabase para validar tokens ASSIMÉTRICOS (ES256/RS256), que é o
    # padrão novo. Informe a URL completa via SUPABASE_JWKS_URL, por exemplo:
    #   https://<project_ref>.supabase.co/auth/v1/.well-known/jwks.json
    # Em branco = não valida tokens assimétricos.
    jwks-url: ${SUPABASE_JWKS_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

---
# DEV profile: in-memory H2 database. Runs with no external configuration.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:plataforma;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true

---
# SUPABASE profile: Supabase-hosted Postgres.
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # O pooler do Supabase funciona melhor com um pool pequeno e sem
      # cache de prepared statements no lado do servidor.
      maximum-pool-size: 5
      connection-timeout: 30000
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true
