spring:
  application:
    name: plataforma-backend
  profiles:
    # Default profile. Set SPRING_PROFILES_ACTIVE=supabase to use the Supabase Postgres database.
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

app:
  # Supabase JWT secret used to validate access tokens (Project Settings -> API -> JWT Secret).
  # When blank, JWT signature validation is skipped (dev convenience only).
  supabase:
    jwt-secret: ${SUPABASE_JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

---
# DEV profile: in-memory H2 database. Runs with no external configuration.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:plataforma;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true

---
# SUPABASE profile: Supabase-hosted Postgres.
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true
