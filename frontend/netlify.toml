[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------
# Proxy das chamadas de API para o backend Spring Boot no Render.
# O frontend chama "/api/..." e o Netlify repassa para o backend,
# evitando problemas de CORS. Precisa vir ANTES do fallback de SPA.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "https://perto-backend-7i7a.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: todas as rotas servem index.html (client-side routing).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
