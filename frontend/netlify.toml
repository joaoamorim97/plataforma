[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------
# Proxy das chamadas de API para o backend Spring Boot.
# Troque a URL abaixo pela URL pública do seu backend (Render/Railway/etc).
# Assim o frontend continua chamando "/api/..." e o Netlify repassa,
# evitando problemas de CORS e sem precisar rebuildar quando a URL mudar.
#
# Enquanto o backend não estiver publicado, deixe comentado (o app roda
# em modo demo e as chamadas /api só funcionam rodando localmente).
# ---------------------------------------------------------------------
# [[redirects]]
#   from = "/api/*"
#   to = "https://SEU-BACKEND.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA fallback: todas as rotas servem index.html (client-side routing).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
